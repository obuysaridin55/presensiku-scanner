<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PresensiKu - Scanner QR</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    .info {
      text-align: center;
      color: #555;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin: 0 auto;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f3f5;
      text-align: center;
      word-break: break-word;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="card">

      <h2>📷 PresensiKu</h2>

      <div class="info">
        Scanner QR NISN Siswa
      </div>

      <div id="reader"></div>

      <div id="hasil">
        Meminta akses kamera...
      </div>

    </div>

  </div>


  <script>

    const hasil =
      document.getElementById('hasil');


    const scanner =
      new Html5Qrcode('reader');


    scanner.start(

      {
        facingMode: 'environment'
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      function(decodedText) {

        const nisn =
          String(decodedText || '').trim();


        if (!nisn) {
          return;
        }


        hasil.textContent =
          'QR terbaca: ' + nisn;


        scanner.stop()
          .catch(function() {});


      },


      function(errorMessage) {

        // Tidak menampilkan
        // pesan ketika QR belum terbaca.

      }

    )


    .catch(function(error) {

      hasil.textContent =
        'Kamera tidak dapat digunakan: ' +
        error;

    });

  </script>

</body>

</html>
