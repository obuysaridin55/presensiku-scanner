<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PresensiKu - Scanner QR</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    .info {
      text-align: center;
      color: #555;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin: 0 auto;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f3f5;
      text-align: center;
      word-break: break-word;
      line-height: 1.6;
    }

    .loading {
      color: #555;
    }

    .success {
      background: #d1e7dd !important;
      color: #0f5132;
    }

    .warning {
      background: #fff3cd !important;
      color: #664d03;
    }

    .error {
      background: #f8d7da !important;
      color: #842029;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #0d6efd;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="card">

      <h2>📷 PresensiKu</h2>

      <div class="info">
        Scanner QR NISN Siswa
      </div>

      <div id="reader"></div>

      <div id="hasil">
        Meminta akses kamera...
      </div>

      <button
        id="btnScanLagi"
        style="display:none;"
        onclick="mulaiScanner()">
        📷 Scan Lagi
      </button>

    </div>

  </div>


  <script>

    // ==========================================================
    // URL WEB APP PRESENSIKU
    // ==========================================================

    const WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbyd6CV_3o6kT8PrV4RZIRd9fpaLRE06Jq9qpuJKrbF2dMTssk59oEDA_a4EB6J_Nk94w/exec';


    // ==========================================================
    // ELEMENT
    // ==========================================================

    const hasil =
      document.getElementById('hasil');

    const btnScanLagi =
      document.getElementById('btnScanLagi');


    // ==========================================================
    // SCANNER
    // ==========================================================

    let scanner =
      new Html5Qrcode('reader');


    let sedangMemproses = false;


    // ==========================================================
    // MULAI SCANNER
    // ==========================================================

    function mulaiScanner() {

      sedangMemproses = false;

      btnScanLagi.style.display = 'none';

      hasil.className = '';

      hasil.innerHTML =
        '📷 Arahkan kamera ke QR NISN siswa...';


      scanner.start(

        {
          facingMode: 'environment'
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        function(decodedText) {

          // ----------------------------------------------------
          // Mencegah QR yang sama diproses berkali-kali
          // ----------------------------------------------------

          if (sedangMemproses) {
            return;
          }

          sedangMemproses = true;


          const nisn =
            String(decodedText || '').trim();


          if (!nisn) {

            sedangMemproses = false;

            return;
          }


          // ----------------------------------------------------
          // Tampilkan NISN
          // ----------------------------------------------------

          hasil.className = 'loading';

          hasil.innerHTML =
            '🔎 QR terbaca<br>' +
            '<strong>NISN: ' +
            nisn +
            '</strong><br><br>' +
            'Mengirim ke PresensiKu...';


          // ----------------------------------------------------
          // Hentikan kamera sementara
          // ----------------------------------------------------

          scanner.stop()
            .catch(function() {});


          // ----------------------------------------------------
          // KIRIM NISN KE WEB APP
          // ----------------------------------------------------

          kirimNISN(nisn);

        },

        function(errorMessage) {

          // Tidak menampilkan error ketika
          // QR belum terbaca.

        }

      )

      .catch(function(error) {

        hasil.className = 'error';

        hasil.innerHTML =
          '❌ Kamera tidak dapat digunakan.<br><br>' +
          String(error);

      });

    }


    // ==========================================================
    // KIRIM NISN KE WEB APP
    // ==========================================================

    function kirimNISN(nisn) {

      const url =
        WEB_APP_URL +
        '?action=scanner' +
        '&nisn=' +
        encodeURIComponent(nisn) +
        '&petugas=' +
        encodeURIComponent('Scanner HP');


      fetch(url, {
        method: 'GET',
        cache: 'no-store'
      })

      .then(function(response) {

        if (!response.ok) {

          throw new Error(
            'HTTP ' +
            response.status
          );

        }

        return response.text();

      })

      .then(function(text) {

        let data;

        try {

          data = JSON.parse(text);

        } catch (error) {

          throw new Error(
            'Respons Web App bukan JSON: ' +
            text.substring(0, 300)
          );

        }


        // ------------------------------------------------------
        // PRESENSI BERHASIL
        // ------------------------------------------------------

        if (data.success) {

          hasil.className = 'success';

          hasil.innerHTML =
            '✅ <strong>PRESENSI BERHASIL</strong><br><br>' +
            'Nama: <strong>' +
            (data.Nama || '-') +
            '</strong><br>' +
            'NISN: ' +
            (data.NISN || '-') +
            '<br>' +
            'Kelas: ' +
            (data.Kelas || '-') +
            '<br>' +
            'Status: <strong>Hadir</strong><br>' +
            'Waktu: ' +
            (data.waktu || '-') +
            '<br><br>' +
            (data.message || '');

        }


        // ------------------------------------------------------
        // SUDAH PRESENSI
        // ------------------------------------------------------

        else if (data.sudahPresensi) {

          hasil.className = 'warning';

          hasil.innerHTML =
            '⚠️ <strong>SUDAH PRESENSI</strong><br><br>' +
            'Nama: <strong>' +
            (data.Nama || '-') +
            '</strong><br>' +
            'NISN: ' +
            (data.NISN || '-') +
            '<br>' +
            'Kelas: ' +
            (data.Kelas || '-') +
            '<br>' +
            'Waktu presensi: ' +
            (data.waktu || '-') +
            '<br><br>' +
            (data.message || 'Siswa sudah melakukan presensi hari ini.');

        }


        // ------------------------------------------------------
        // ERROR DARI BACKEND
        // ------------------------------------------------------

        else {

          hasil.className = 'error';

          hasil.innerHTML =
            '❌ <strong>GAGAL</strong><br><br>' +
            (data.message || 'Terjadi kesalahan.');

        }


        btnScanLagi.style.display =
          'block';

      })

      .catch(function(error) {

        hasil.className = 'error';

        hasil.innerHTML =
          '❌ <strong>Gagal terhubung ke Web App</strong><br><br>' +
          String(error) +
          '<br><br>' +
          'Pastikan koneksi internet HP aktif.';


        btnScanLagi.style.display =
          'block';

      });

    }


    // ==========================================================
    // MULAI OTOMATIS
    // ==========================================================

    mulaiScanner();

  </script>

</body>

</html>
